name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifacts (main branch)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            main.js
            manifest.json
            styles.css

      - name: Sync manifest version with tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));m.version=process.env.TAG.replace(/^v/,'');fs.writeFileSync('manifest.json',JSON.stringify(m,null,'\t')+'\n');"

      - name: Create GitHub Release (tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
